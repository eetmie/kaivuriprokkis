# Jetson Orin Nano PCA9685 servo control
#
# Header I2C pins 3/5 map to Linux bus 7 on this robot. The Jetson setup uses
# only this main I2C bus for PCA9685 control; IMU data is read over USB serial.
# The bus/address are selected by the caller via PWMController(bus=7,
# i2c_addr=0x40).
#
# TODO(jetson): test 1 MHz operation on bus 7. The Raspberry Pi main I2C bus
# runs well at 1 MHz, but Jetson needs a different device-tree/kernel setup.
#
# Keep output_channel values contiguous. The PWM driver writes one range from
# min channel to max channel, so gaps waste I2C bandwidth.

pwm_frequency: 100

# deadzone is a PERCENT of the normalized command (deadzone_threshold =
# deadzone / 100.0 in modules/pwm/config.py), applied with rescaling: |v| below
# the threshold goes to center, and what is left is stretched so 1.0 still
# reaches pulse_max. Nothing at the top of the range is lost.
#
# slew/boom/arm/bucket run 2.0 (= |v| < 0.02 -> center) because ANY non-zero
# command jumps the spool straight to the deadband edge -- 130-160 us on the
# working joints, which on arm and bucket is more than the 115 us of pulse
# width covering the entire rest of the command range. A command dithering
# around zero therefore slams the spool across the deadband while the machine
# does not move, and it also holds dither_enable on (dither_active is just
# base_pulse != center), so the valve gets +-25 us at 33 Hz on top.
#
# 2% was measured, not guessed: 100 s of live VLA digging
# (tools/analyze_action_log.py on a run_inference --log-actions log, 2026-08-27)
# put 31-71% of emitted commands under 0.02 while the 0.02-0.12 band was
# nearly empty -- the threshold sits in a real gap in the distribution. It cut
# full-deadband traverses from 2.9-6.9/s to ~0.2/s and total spool travel by
# 42-87%, at the cost of 0.6-3.5% of commanded displacement. The policy emits
# these because its target is exactly 0.0 (a centered stick records a hard zero
# through the gamepad's own 25% deadzone; the dataset's action q50 is 0.0 on
# all four channels) and a denoiser lands near zero rather than on it. No
# retraining fixes that, which is why the gate lives here: it is downstream of
# every producer, and of the setpoint schedule's interpolation and decay ramp.
#
# Re-measure before assuming 2.0 suits a different checkpoint or task string.
# Track and extra channels stay at 0.0 -- they have no deadband configured.


CHANNEL_CONFIGS:

    trackL:
        output_channel: 0
        affects_pump: False
        toggleable: True
        center: 1500
        direction: 1
        pulse_min: 1000
        pulse_max: 2000
        deadzone: 0.0
        deadband_us_pos: 0.0
        deadband_us_neg: 0.0
        dither_enable: False
        dither_amp_us: 25.0
        dither_hz: 33.0
        dither_taper: False
        dither_taper_us: 20.0
        ramp_enable: False
        ramp_limit: 1500.0
        ramp_skip_deadband: False
        gamma: 1.0

    trackR:
        output_channel: 1
        affects_pump: False
        toggleable: True
        center: 1500
