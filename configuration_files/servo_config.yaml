# servo control
#
# IMPORTANT: Keep output_channel values contiguous (no gaps between channels)!
# The PWM driver writes all channels in a single I2C transaction from min to max.
# Gaps waste I2C bandwidth. Current layout: ch 2-6 = 21 bytes per write.
# With gaps (e.g. ch 2-5 + ch 9) would need 33 bytes or multiple transactions.

CHANNEL_CONFIGS:

    pump:
        # TODO: update physical connection to match!
        output_channel: 6
        pulse_min: 1000
        pulse_max: 1700
        idle: 0.40 # 0.45
        multiplier: 0.4


    lift_boom:
        output_channel: 3  # output pin on the servo board
        affects_pump: True # whether moving this servo affects the pump speed (if set to variable)
        toggleable: False  # whether this servo can be toggled on/off via call
        center: 1570       # 1566 center pulse width in microseconds
        direction: 1       # pretty self-explanatory, -1 or 1
        pulse_min: 1358    # extend. This sets max velocity. Increase until arm doesn't go faster --> valve fully open
        pulse_max: 1770    # retract. Max velocity in other direction
        deadzone: 1.2      # % of total range to ignore around center (=cuts out values)

        deadband_us_pos: 155.0 #150 pos/neg offsets from center (us)
        deadband_us_neg: 155.0 # if these match, your center value is prob correct :)

        dither_enable: True # dither on/off. Adds vibration to reduce valve stiction.
        dither_amp_us: 20.0 # dither amplitude in microseconds (us)
        dither_hz: 15.0     # dither frequency in Hz
        dither_taper: False # taper dither near limits instead of expanding clamp

        ramp_enable: False    # linear slew limit on pulse changes
        ramp_limit: 1200.0    # max rate in us/s; lower = smoother, less overshoot
        s_curve_enable: False # jerk-limited ramping (s-curve) when true. Ramp also needs to be enabled!
        accel_limit: 0.0      # ramp accel in us/s^2; used when s_curve_enable is true

        gamma: 1.0          # curve shaping; <1 = more sensitive near center. Set to 0.5 for the classic inverse square root -type correction



    tilt_boom:
        output_channel: 4
        affects_pump: True
        toggleable: False
        center: 1485 # 1487
        direction: 1
        pulse_min: 1250     # ret
        pulse_max: 1720     # ext
        deadzone: 1.0
        deadband_us_pos: 130.0
        deadband_us_neg: 130.0
        dither_enable: true
        dither_amp_us: 20.0
        dither_hz: 15.0
        dither_taper: False
        ramp_enable: False
        ramp_limit: 1000.0
        s_curve_enable: False
        accel_limit: 0.0
        gamma: 1.0

    scoop:
        output_channel: 2
        affects_pump: True
        toggleable: False
        center: 1395
        direction: -1       # ext/ret flipped!
        pulse_min: 1170     # ext
        pulse_max: 1620     # ret 1620
        deadzone: 1.0
        deadband_us_pos: 120.0
        deadband_us_neg: 120.0 # 140 all
        dither_enable: true
        dither_amp_us: 20.0
        dither_hz: 15.0
        dither_taper: False
        ramp_enable: False
        ramp_limit: 1000.0
        s_curve_enable: False
        accel_limit: 0.0
        gamma: 1.0

    rotate:
        output_channel: 5
        affects_pump: False
        toggleable: False
        center: 1555                #1558
        direction: -1
        pulse_min: 1509
        pulse_max: 1604             #1604
        deadzone: 1.0
        deadband_us_pos: 45.5       # 45.0
        deadband_us_neg: 45.5       # 44.5
        dither_enable: False
        dither_amp_us: 15.0
        dither_hz: 16.0
        dither_taper: False
        ramp_enable: false
        ramp_limit: 100.0
        s_curve_enable: False
        accel_limit: 0.0
        gamma: 1.0
